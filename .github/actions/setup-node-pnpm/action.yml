name: 'Setup Node.js and PNPM'
description: 'Sets up Node.js with specified version and installs PNPM'
inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22.x'
  cache:
    description: 'Enable dependency caching'
    required: false
    default: 'true'
  node-auth-token:
    description: 'Node.js authentication token for private registries (optional)'
    required: false
    default: ''
  working-directory:
    description: >
      Directory holding the package.json, pnpm-lock.yaml and packageManager
      field. pnpm reads packageManager from the package.json it runs next to,
      and the install must run where the lockfile is. A caller job's
      defaults.run.working-directory does NOT reach inside a composite action.
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Install PNPM
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}

    # A working-directory inside a pnpm workspace (apps/webapp of a monorepo)
    # has no lockfile of its own, and pnpm reads registry auth from the
    # workspace root's .npmrc, not from a package's. So the auth and the
    # install go to the nearest ancestor with pnpm-workspace.yaml, when there
    # is one; the build still runs in working-directory.
    - name: Find the install root
      id: root
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        start=$(pwd)
        top=$(git rev-parse --show-toplevel 2>/dev/null || echo "${GITHUB_WORKSPACE:-/}")
        dir=$start
        while [ ! -f "$dir/pnpm-workspace.yaml" ]; do
          if [ "$dir" = "$top" ] || [ "$dir" = "/" ]; then dir=$start; break; fi
          dir=$(dirname "$dir")
        done
        [ "$dir" = "$start" ] || echo "Workspace root: $dir (working-directory is a package in it)"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

    # Appended, not written: the repo's own .npmrc settings stay.
    - name: Configure npm auth for GitHub Packages
      shell: bash
      working-directory: ${{ steps.root.outputs.dir }}
      run: |
        if [ -n "${NODE_AUTH_TOKEN}" ]; then
          echo "Configuring GitHub Packages authentication..."
          printf "@pursuit-amsterdam:registry=https://npm.pkg.github.com\nalways-auth=true\n" >> .npmrc
          printf "//npm.pkg.github.com/:_authToken=%s\n" "${NODE_AUTH_TOKEN}" >> .npmrc
          echo "✓ Authentication configured"
        else
          echo "⚠ No auth token provided, skipping GitHub Packages authentication"
        fi
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token }}

    # --frozen-lockfile: CD must install exactly what CI tested. A missing or
    # outdated pnpm-lock.yaml fails here instead of silently resolving anew.
    - name: Install dependencies
      shell: bash
      working-directory: ${{ steps.root.outputs.dir }}
      run: pnpm install --frozen-lockfile
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token }}
