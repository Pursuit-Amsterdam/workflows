name: 'Load 1Password Secrets'
description: 'Fetches secrets from 1Password and exports them to environment'
inputs:
  service-account-token:
    description: '1Password Service Account Token'
    required: true
  vault-name:
    description: '1Password vault name'
    required: true
  item-name:
    description: '1Password item name'
    required: true
  export-for-vercel:
    description: 'Export secrets in Vercel CLI deployment format'
    required: false
    default: 'false'
  vercel-env-file:
    description: 'Path to save Vercel environment arguments'
    required: false
    default: 'vercel_env_args.bin'
  export-build-args:
    description: 'Emit a space-separated key=value list of the plain (non-secret) fields, for use as Docker build args'
    required: false
    default: 'false'

outputs:
  build_args:
    description: 'Space-separated key=value list of plain (non-secret) fields (e.g. NEXT_PUBLIC_*) for Docker build args'
    value: ${{ steps.export-secrets.outputs.build_args }}

runs:
  using: 'composite'
  steps:
    - name: Install 1Password CLI
      uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

    - name: Configure 1Password
      uses: 1password/load-secrets-action/configure@581a835fb51b8e7ec56b71cf2ffddd7e68bb25e0 # v2.0.0
      with:
        service-account-token: ${{ inputs.service-account-token }}

    - name: Load secrets from 1Password
      id: export-secrets
      shell: bash
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.service-account-token }}
        OP_VAULT_NAME: ${{ inputs.vault-name }}
        OP_ITEM_NAME: ${{ inputs.item-name }}
        EXPORT_FOR_VERCEL: ${{ inputs.export-for-vercel }}
        EXPORT_BUILD_ARGS: ${{ inputs.export-build-args }}
        VERCEL_ENV_FILE: ${{ inputs.vercel-env-file }}
      run: |
        set -euo pipefail

        echo "Fetching secrets from 1Password..."
        item_json="$(op item get "${OP_ITEM_NAME}" --vault "${OP_VAULT_NAME}" --format json)"

        echo "Parsing and exporting secrets..."
        # Three NUL-terminated strings per field: type, label, value. A value
        # cannot hold a NUL, so a multiline field (a PEM) stays one value.
        # Trailing newlines (a paste into 1Password) are dropped. jq writes a
        # file, not a process substitution, so a failure (an item without
        # fields, no JSON) fails the step instead of exporting nothing.
        records="$(mktemp)"
        trap 'rm -f "$records"' EXIT
        jq --raw-output0 '
          .fields[]
          | select(.value != null)
          | select((.label // "") != "notesPlain")
          | (.type // ""), (.label // ""), (.value | tostring | sub("[\r\n]+$"; ""))
        ' <<<"$item_json" >"$records"
        mapfile -d '' -t record <"$records"

        # ::add-mask:: data is unescaped by the runner (%25, %0D, %0A), so
        # escape it, or a value with %25 in it registers a different mask.
        mask() {
          local v="${1//'%'/%25}"
          v="${v//$'\r'/%0D}"
          v="${v//$'\n'/%0A}"
          printf '::add-mask::%s\n' "$v"
        }

        # A random heredoc delimiter: a line in a value equal to a fixed one
        # would end the block early. Robustness, not a security boundary: who
        # can edit the item can add any variable anyway.
        eof="OP_EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"

        if [[ "${EXPORT_FOR_VERCEL}" == "true" ]]; then
          : > "${VERCEL_ENV_FILE}"
        fi

        if [[ "${EXPORT_BUILD_ARGS}" == "true" ]]; then
          build_args_array=()
        fi

        echo "Exporting $(( ${#record[@]} / 3 )) fields to environment variables..."
        for (( i = 0; i < ${#record[@]}; i += 3 )); do
          ftype="${record[i]}"
          name="${record[i+1]}"
          value="${record[i+2]}"

          # The label is the variable name. A name with = or << in it breaks
          # the GITHUB_ENV format, so only a plain identifier passes.
          if [[ ! "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            printf '::warning::1Password field %q skipped: not a valid environment variable name\n' "$name"
            continue
          fi

          # Plain types are config; every other type (CONCEALED, SSHKEY, OTP,
          # CREDIT_CARD_NUMBER, an unknown one) is a secret. Same list as
          # state() in scripts/lib/vaults.ts.
          case "$ftype" in
            STRING|URL|EMAIL|PHONE|DATE|MONTH_YEAR|MENU) secret=false ;;
            *) secret=true ;;
          esac

          # Mask secrets only. GitHub redacts a masked value everywhere in the
          # output, so masking config (WORKER_REPLICAS=3) shreds every log and
          # job summary. The runner masks each line of a multiline mask too,
          # so a multiline secret goes in line by line, without the lines of
          # 4 characters or fewer ({, ], ==): masking those shreds the logs
          # just the same, and they give nothing away.
          if [[ "$secret" == true ]]; then
            if [[ "$value" != *$'\n'* ]]; then
              [[ "$value" != *[![:space:]]* ]] || mask "$value"
            else
              while IFS= read -r line; do
                line="${line#"${line%%[![:space:]]*}"}"
                line="${line%"${line##*[![:space:]]}"}"
                if (( ${#line} > 4 )); then mask "$line"; fi
              done <<<"$value"
            fi
          fi

          printf '%s<<%s\n%s\n%s\n' "$name" "$eof" "$value" "$eof" >> "$GITHUB_ENV"

          # Vercel export
          if [[ "${EXPORT_FOR_VERCEL}" == "true" ]]; then
            printf '%s\0' --env "${name}=${value}" >> "${VERCEL_ENV_FILE}"
          fi

          # Build args: plain fields only — never bake secrets into an image.
          # The list is one line, so a multiline field cannot be one.
          if [[ "${EXPORT_BUILD_ARGS}" == "true" && "$secret" == false ]]; then
            if [[ "$value" == *$'\n'* ]]; then
              echo "::warning::${name} has more than one line; left out of the build args"
            else
              build_args_array+=("${name}=${value}")
            fi
          fi
        done

        echo "Successfully exported secrets."

        if [[ "${EXPORT_FOR_VERCEL}" == "true" ]]; then
          echo "VERCEL_ENV_ARGS_BIN=$PWD/${VERCEL_ENV_FILE}" >> "$GITHUB_ENV"
          echo "Vercel environment file prepared: ${VERCEL_ENV_FILE}"
        fi

        if [[ "${EXPORT_BUILD_ARGS}" == "true" ]]; then
          echo "build_args=${build_args_array[*]}" >> "$GITHUB_OUTPUT"
          echo "Exported ${#build_args_array[@]} build args (plain fields only)"
        fi