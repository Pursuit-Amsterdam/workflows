name: 'Load 1Password Secrets'
description: 'Fetches secrets from 1Password and exports them to environment'
inputs:
  service-account-token:
    description: '1Password Service Account Token'
    required: true
  vault-name:
    description: '1Password vault name'
    required: true
  item-name:
    description: '1Password item name'
    required: true
  export-for-vercel:
    description: 'Export secrets in Vercel CLI deployment format'
    required: false
    default: 'false'
  vercel-env-file:
    description: 'Path to save Vercel environment arguments'
    required: false
    default: 'vercel_env_args.bin'
  export-build-args:
    description: 'Emit a space-separated key=value list of the non-concealed fields, for use as Docker build args'
    required: false
    default: 'false'

outputs:
  build_args:
    description: 'Space-separated key=value list of non-concealed fields (e.g. NEXT_PUBLIC_*) for Docker build args'
    value: ${{ steps.export-secrets.outputs.build_args }}

runs:
  using: 'composite'
  steps:
    - name: Install 1Password CLI
      uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

    - name: Configure 1Password
      uses: 1password/load-secrets-action/configure@581a835fb51b8e7ec56b71cf2ffddd7e68bb25e0 # v2.0.0
      with:
        service-account-token: ${{ inputs.service-account-token }}

    - name: Load secrets from 1Password
      id: export-secrets
      shell: bash
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.service-account-token }}
        OP_VAULT_NAME: ${{ inputs.vault-name }}
        OP_ITEM_NAME: ${{ inputs.item-name }}
        EXPORT_FOR_VERCEL: ${{ inputs.export-for-vercel }}
        EXPORT_BUILD_ARGS: ${{ inputs.export-build-args }}
        VERCEL_ENV_FILE: ${{ inputs.vercel-env-file }}
      run: |
        set -euo pipefail

        echo "Fetching secrets from 1Password..."
        item_json="$(op item get "${OP_ITEM_NAME}" --vault "${OP_VAULT_NAME}" --format json)"

        echo "Parsing and exporting secrets..."
        # One line per field: TYPE|LABEL|base64(value). The value is base64 so
        # a multiline field (a PEM) stays one entry; jq -r would split it.
        mapfile -t fields < <(jq -r '
          .fields[]
          | select(.value != null)
          | select((.label // "") != "notesPlain")
          | "\(.type // "")|\(.label)|\(.value | tostring | @base64)"
        ' <<<"$item_json")

        # A random heredoc delimiter, so no line of a value can end the block.
        eof="OP_EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"

        if [[ "${EXPORT_FOR_VERCEL}" == "true" ]]; then
          : > "${VERCEL_ENV_FILE}"
        fi

        if [[ "${EXPORT_BUILD_ARGS}" == "true" ]]; then
          build_args_array=()
        fi

        echo "Exporting ${#fields[@]} fields to environment variables..."
        for entry in "${fields[@]}"; do
          ftype="${entry%%|*}"
          rest="${entry#*|}"
          name="${rest%|*}"
          # The x keeps trailing newlines, which $( ) strips.
          value="$(base64 --decode <<<"${rest##*|}"; printf x)"
          value="${value%x}"

          # Mask concealed (password) fields only. Plain-text fields are
          # non-secret config (WORKER_REPLICAS, NEXT_PUBLIC_*), and GitHub
          # redacts a masked value everywhere in the output, so masking a
          # short one (WORKER_REPLICAS=3) shreds every log and job summary.
          # ::add-mask:: takes one line, so each line of a value apart.
          if [[ "$ftype" == "CONCEALED" ]]; then
            while IFS= read -r line; do
              [[ -z "$line" ]] || echo "::add-mask::${line}"
            done <<<"$value"
          fi

          printf '%s<<%s\n%s\n%s\n' "$name" "$eof" "$value" "$eof" >> "$GITHUB_ENV"

          # Vercel export
          if [[ "${EXPORT_FOR_VERCEL}" == "true" ]]; then
            printf '%s\0' --env "${name}=${value}" >> "${VERCEL_ENV_FILE}"
          fi

          # Build args: non-concealed fields only — never bake secrets into an
          # image. The list is one line, so a multiline field cannot be one.
          if [[ "${EXPORT_BUILD_ARGS}" == "true" && "$ftype" != "CONCEALED" ]]; then
            if [[ "$value" == *$'\n'* ]]; then
              echo "::warning::${name} has more than one line; left out of the build args"
            else
              build_args_array+=("${name}=${value}")
            fi
          fi
        done

        echo "Successfully exported secrets."

        if [[ "${EXPORT_FOR_VERCEL}" == "true" ]]; then
          echo "VERCEL_ENV_ARGS_BIN=$PWD/${VERCEL_ENV_FILE}" >> "$GITHUB_ENV"
          echo "Vercel environment file prepared: ${VERCEL_ENV_FILE}"
        fi

        if [[ "${EXPORT_BUILD_ARGS}" == "true" ]]; then
          echo "build_args=${build_args_array[*]}" >> "$GITHUB_OUTPUT"
          echo "Exported ${#build_args_array[@]} build args (non-concealed only)"
        fi