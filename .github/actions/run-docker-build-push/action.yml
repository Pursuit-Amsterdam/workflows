name: 'Build and Push Docker Image'
description: 'Builds and pushes Docker image to GitHub Container Registry'
inputs:
  docker-file:
    description: 'Path to the Dockerfile'
    required: false
    default: './Dockerfile'
  build-context:
    description: 'Docker build context directory'
    required: false
    default: '.'
  image-name:
    description: 'Name of the Docker image to build and push'
    required: true
  image-tag:
    description: 'Tag for the Docker image'
    required: true
  image-platform:
    description: 'Target platform for the Docker image'
    required: false
    default: 'linux/amd64'
  build-args:
    description: 'Build arguments for Docker build'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for registry authentication'
    required: true
  node-auth-token:
    description: 'Node.js authentication token for private npm packages during build'
    required: false
    default: ''
  python-auth-token:
    description: 'GitHub token for private Python packages during build'
    required: false
    default: ''
  additional-tags:
    description: >
      Extra image:tag references to push alongside image-name:image-tag,
      space-separated (e.g. a content-addressable sha-<hash> tag). Empty =
      push only the primary tag.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ inputs.github-token }}

    - name: Prepare Docker build args
      id: prepare_build_args
      shell: bash
      run: |
        # Convert space-separated to newline-separated
        args="${{ inputs.build-args }}"
        build_args=$(echo "$args" | tr ' ' '\n')
        {
          echo "build_args<<EOF"
          echo "$build_args"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Prepare image tags
      id: prepare_tags
      shell: bash
      env:
        PRIMARY_TAG: ${{ inputs.image-name }}:${{ inputs.image-tag }}
        ADDITIONAL_TAGS: ${{ inputs.additional-tags }}
      run: |
        {
          echo "tags<<EOF"
          echo "$PRIMARY_TAG"
          if [[ -n "$ADDITIONAL_TAGS" ]]; then
            tr ' ' '\n' <<< "$ADDITIONAL_TAGS"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Build and push container image to registry
      uses: docker/build-push-action@v7
      with:
          context: ${{ inputs.build-context }}
          push: true
          tags: ${{ steps.prepare_tags.outputs.tags }}
          file: ${{ inputs.docker-file }}
          platforms: ${{ inputs.image-platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ steps.prepare_build_args.outputs.build_args }}
          secrets: |
            NODE_AUTH_TOKEN=${{ inputs.node-auth-token }}
            GITHUB_TOKEN=${{ inputs.python-auth-token }}
