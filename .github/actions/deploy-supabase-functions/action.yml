name: "Deploy Supabase Edge Functions"
description: >-
  Syncs Edge Function secrets and deploys Edge Functions with the Supabase CLI.
  Secret values are read from the job environment (load them first, e.g. via
  setup-onepassword), so this action never talks to a secret store itself.
inputs:
  access-token:
    description: >-
      Supabase personal access token. `supabase secrets set` requires Owner or
      Administrator on the Supabase org, so this must come from a machine
      account with that role -- not from a developer's own account.
    required: true
  project-ref:
    description: "Supabase project ref (the id in the project URL)."
    required: true
  functions:
    description: >-
      Space-separated function names to deploy. Empty (the default) deploys
      every function declared in supabase/config.toml, which keeps config.toml
      the single source of truth.
    required: false
    default: ""
  secret-names:
    description: >-
      Space-separated env var names to sync to the Supabase secret store before
      deploying. Values are read from the environment populated by
      setup-onepassword. Empty skips the sync entirely.
    required: false
    default: ""
  use-api:
    description: >-
      Bundle functions server-side via the Management API instead of locally
      with Docker. Keeps Docker off the runner; set to "false" only if a
      function needs something the API bundler cannot do.
    required: false
    default: "true"
  working-directory:
    description: >-
      Directory containing the `supabase/` folder. Required when the project is
      not at the repo root -- a caller job's `defaults.run.working-directory`
      does NOT reach inside a composite action, and the CLI reads
      supabase/config.toml relative to the working directory.
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    # `required: true` is not enforced for composite-action inputs, and both of
    # these arrive from optional workflow_call secrets -- an unset secret is an
    # empty string, which otherwise fails deep inside the CLI with no hint that
    # a GitHub secret is what is missing.
    - name: Validate required inputs
      shell: bash
      env:
        ACCESS_TOKEN: ${{ inputs.access-token }}
        PROJECT_REF: ${{ inputs.project-ref }}
      run: |
        set -euo pipefail

        missing=0
        if [[ -z "${ACCESS_TOKEN}" ]]; then
          echo "::error::access-token is empty. Is the SUPABASE_ACCESS_TOKEN secret set for this repository/environment, and passed through by the caller?"
          missing=1
        fi
        if [[ -z "${PROJECT_REF}" ]]; then
          echo "::error::project-ref is empty. Is the SUPABASE_PROJECT_REF secret set for this environment, and passed through by the caller?"
          missing=1
        fi
        [[ "${missing}" -eq 0 ]]

    - name: Install Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    # Every release re-asserts the full set, so the Supabase secret store cannot
    # drift from 1Password -- the same reasoning as the Vercel project-env sync
    # in deploy-vercel. Unlike that sync, a missing value is fatal here: an Edge
    # Function that starts with an empty env fails at request time with a 401 or
    # a 500 that looks like anything else, so failing the release is strictly
    # cheaper to diagnose.
    - name: Sync Edge Function secrets
      if: inputs.secret-names != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access-token }}
        PROJECT_REF: ${{ inputs.project-ref }}
        SECRET_NAMES: ${{ inputs.secret-names }}
      run: |
        set -euo pipefail
        # Unquoted ${SECRET_NAMES} below is deliberate word splitting, but it
        # also invites pathname expansion -- a name containing a glob character
        # would otherwise silently become whatever file it happens to match.
        set -f

        env_file="$(mktemp)"
        trap 'rm -f "${env_file}"' EXIT
        chmod 600 "${env_file}"

        count=0
        for name in ${SECRET_NAMES}; do
          # Check the shape before the indirect expansion below: `${!name}` on
          # anything that is not a valid identifier aborts with bash's own
          # "invalid variable name", which says nothing about where the typo is.
          if [[ ! "${name}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "::error::'${name}' in secret-names is not a valid environment variable name. Expected names separated by spaces, e.g. 'WEBHOOK_SECRET SMTP2GO_API_KEY'."
            exit 1
          fi

          # Supabase reserves this prefix for the keys it injects itself
          # (SUPABASE_URL, SUPABASE_SECRET_KEYS, ...) and rejects the whole
          # batch if one shows up. Catch it here with a name, not there.
          if [[ "${name}" == SUPABASE_* ]]; then
            echo "::error::${name} uses the reserved SUPABASE_ prefix and cannot be set as a function secret."
            exit 1
          fi

          value="${!name:-}"
          if [[ -z "${value}" ]]; then
            # Two distinct causes, and the second is easy to miss: if no step
            # loaded secrets into the environment at all, EVERY name fails here
            # and the item is a red herring.
            echo "::error::${name} is listed in secret-names but not set in the environment. Either it is missing from the loaded secrets item (check the exact spelling), or no secrets were loaded at all -- setup-onepassword only runs when onepassword_enabled is true."
            exit 1
          fi

          # Values are single-line by convention (generated tokens, API keys).
          # A multiline value would need dotenv quoting the CLI does not apply.
          # CR matters as much as LF: a value pasted into 1Password from a
          # Windows editor carries a trailing \r, which travels all the way into
          # the secret store and makes the function 401 at request time -- the
          # exact failure this validation exists to prevent.
          if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
            echo "::error::${name} contains a line break; the Supabase env-file format takes single-line values only. A trailing CR from a copy-paste counts -- check the 1Password field."
            exit 1
          fi

          printf '%s=%s\n' "${name}" "${value}" >> "${env_file}"
          count=$((count + 1))
        done

        echo "Syncing ${count} secret(s) to project ${PROJECT_REF}..."
        supabase secrets set --project-ref "${PROJECT_REF}" --env-file "${env_file}"

    # verify_jwt, import_map and entrypoint all come from supabase/config.toml,
    # so nothing about a function's wiring lives in the workflow.
    - name: Deploy Edge Functions
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access-token }}
        PROJECT_REF: ${{ inputs.project-ref }}
        FUNCTIONS: ${{ inputs.functions }}
        USE_API: ${{ inputs.use-api }}
      run: |
        set -euo pipefail
        # See the sync step: word-split ${FUNCTIONS}, but never glob it.
        set -f

        deploy_args=("--project-ref" "${PROJECT_REF}")
        if [[ "${USE_API}" == "true" ]]; then
          deploy_args+=("--use-api")
        fi

        if [[ -z "${FUNCTIONS}" ]]; then
          echo "Deploying every function declared in supabase/config.toml..."
          supabase functions deploy "${deploy_args[@]}"
        else
          for fn in ${FUNCTIONS}; do
            echo "Deploying ${fn}..."
            supabase functions deploy "${fn}" "${deploy_args[@]}"
          done
        fi
