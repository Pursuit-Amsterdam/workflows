name: "Deploy to Vercel"
description: "Deploys application to Vercel with environment variables"
inputs:
  vercel-token:
    description: "Vercel authentication token"
    required: true
  vercel-org-id:
    description: "Vercel organization ID"
    required: true
  vercel-project-id:
    description: "Vercel project ID"
    required: true
  environment:
    description: "GitHub environment: staging (a preview deploy, the preview of develop) or production (--prod). Anything else is refused."
    required: false
    default: "staging"
  vercel-env-args-file:
    description: "Path to file containing Vercel environment arguments"
    required: false
    default: ""
  build-mode:
    description: 'Build mode: "github" (build prebuilt artifacts) or "vercel" (build on Vercel)'
    required: false
    default: "github"
  prepare-package:
    description: 'Remove "type": "module" from package.json for runtime'
    required: false
    default: "false"
  build-command:
    description: "Custom build command to run before deployment"
    required: false
    default: ""
  vercel-project-env-keys:
    description: >-
      Space-separated env var names to ALSO write to Vercel's project-level
      environment store (Settings -> Environment Variables), on top of the
      baked env file. Only needed for variables the Vercel platform itself
      reads rather than the app, e.g. CRON_SECRET. Values are read from the
      environment populated by setup-onepassword.
    required: false
    default: "CRON_SECRET"
  working-directory:
    description: "Directory holding the app's package.json. A job's defaults.run.working-directory does not reach the steps of a composite action."
    required: false
    default: "."

outputs:
  url:
    description: "Deployment URL, as `vercel deploy` prints it"
    value: ${{ steps.deploy-github.outputs.url || steps.deploy-vercel.outputs.url }}

runs:
  using: "composite"
  steps:
    # An unknown build-mode would skip both deploy steps below and turn the
    # run green without deploying anything. Only staging and production are
    # decided for Vercel: acceptance, or a typo, must not land on preview.
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        BUILD_MODE: ${{ inputs.build-mode }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        case "$BUILD_MODE" in github|vercel) ;; *)
          echo "::error::build-mode must be github or vercel (got '$BUILD_MODE')"; exit 1;; esac
        case "$ENVIRONMENT" in staging|production) ;; *)
          echo "::error::Vercel deploys to staging (the preview of develop) or production (got '$ENVIRONMENT')"; exit 1;; esac

    # Some environment variables are consumed by the Vercel platform itself,
    # not by the deployed app. Cron is the case that bites: Vercel only
    # attaches the `Authorization: Bearer <CRON_SECRET>` header to scheduled
    # requests when a PROJECT-LEVEL CRON_SECRET exists. The env file this
    # action writes further down is baked into the prebuilt output, so it sets
    # process.env correctly at runtime but is invisible to the scheduler --
    # which then sends no header at all and every /api/cron/* route answers
    # 401, indistinguishable in the logs from a cron with nothing to do.
    #
    # Only the keys named in vercel-project-env-keys are synced. 1Password
    # stays the source of truth: every deploy re-asserts the value, so the
    # project store cannot drift from the env file. Do NOT list keys the app
    # merely reads at runtime -- the env file already covers those, and
    # duplicating them spreads secrets across two stores for no benefit.
    #
    # Runs before the CLI install so a misconfiguration fails fast.
    - name: Sync platform-consumed env vars to project level
      if: inputs.vercel-project-env-keys != ''
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        ENVIRONMENT: ${{ inputs.environment }}
        PROJECT_ENV_KEYS: ${{ inputs.vercel-project-env-keys }}
      run: |
        set -euo pipefail

        if [[ "${ENVIRONMENT}" == "production" ]]; then
          target="production"
        else
          target="preview"
        fi

        api="https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true"
        # Only team-scoped ids take a teamId; personal-scope projects do not.
        if [[ "${VERCEL_ORG_ID}" == team_* ]]; then
          api="${api}&teamId=${VERCEL_ORG_ID}"
        fi

        for key in ${PROJECT_ENV_KEYS}; do
          value="${!key:-}"
          if [[ -z "${value}" ]]; then
            # Not fatal: the allowlist applies to every Vercel project, and one
            # without crons has no CRON_SECRET to sync. A cron project that
            # loses its secret is caught at runtime instead -- the cron routes
            # log the rejection reason on a 401.
            echo "::warning::${key} is not set in the environment; skipping project-level sync. Expected for projects that do not use it."
            continue
          fi

          payload="$(jq -n --arg k "${key}" --arg v "${value}" --arg t "${target}" \
            '{key: $k, value: $v, type: "encrypted", target: [$t]}')"

          if ! curl -sS --fail-with-body -X POST "${api}" \
                 -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                 -H "Content-Type: application/json" \
                 -d "${payload}" >/dev/null; then
            echo "::error::Failed to sync ${key} to the Vercel project env (${target}). Does the token have env write scope?"
            exit 1
          fi

          echo "Synced ${key} to project-level env (${target})"
        done

    # A fixed version: @latest changes the CLI under every deploy, and Vercel
    # ships a major most weeks.
    - name: Install Vercel CLI
      id: install
      shell: bash
      run: npm install --global vercel@62.5.0

    - name: Prepare package for runtime
      if: inputs.prepare-package == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "Preparing package.json for runtime..."
        node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete pkg.type;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          console.log('Removed type field from package.json');
        "

    - name: Run custom build command
      if: inputs.build-command != '' && inputs.build-mode == 'github'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build-command }}

    # Vercel knows two environments here: production and preview. Staging is
    # the preview deploy of develop (decided in docs/v2), so staging pulls and
    # deploys as preview; --target=staging would ask for a custom environment
    # that does not exist. The validate step allows nothing else.
    - name: Deploy with GitHub Build (Prebuilt)
      id: deploy-github
      if: inputs.build-mode == 'github'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        if [[ "${ENVIRONMENT}" == "production" ]]; then
          vercel_env="production"; prod=("--prod")
        else
          vercel_env="preview"; prod=()
        fi
        echo "Building for ${ENVIRONMENT} (Vercel ${vercel_env}, GitHub build mode)..."

        # Pull Vercel project settings
        vercel pull --yes --environment="${vercel_env}" --token="${VERCEL_TOKEN}"

        # Inject 1Password secrets into .vercel/.env.<env>.local so they are
        # available both at build time and bundled into the prebuilt output
        # for runtime serverless functions. --env on `vercel deploy --prebuilt`
        # is largely a no-op, so the env file is the only reliable channel.
        if [[ -n "${VERCEL_ENV_ARGS_BIN:-}" && -f "${VERCEL_ENV_ARGS_BIN}" ]]; then
          echo "Injecting 1Password secrets into .vercel/.env.${vercel_env}.local..."
          python3 -c '
        import os
        data = open(os.environ["VERCEL_ENV_ARGS_BIN"], "rb").read().split(b"\0")
        out = []
        i = 0
        while i < len(data) - 1:
            if data[i] == b"--env":
                kv = data[i + 1].decode()
                k, _, v = kv.partition("=")
                # Double-quoted dotenv form. npm dotenv (what Vercel uses)
                # does not expand $VAR, but does interpret \n, \r, \t and
                # backslash-escapes inside double quotes, so we only need to
                # escape backslashes and double quotes.
                escaped = v.replace("\\", "\\\\").replace("\"", "\\\"")
                out.append(f"{k}=\"{escaped}\"")
                i += 2
            else:
                i += 1
        print("\n".join(out))
        ' >> ".vercel/.env.${vercel_env}.local"
        fi

        # Build project artifacts
        vercel build "${prod[@]}" --token="${VERCEL_TOKEN}"

        echo "Deploying prebuilt artifacts to Vercel (${vercel_env})..."
        deploy_args=("--prebuilt" "--archive=tgz" "--token=${VERCEL_TOKEN}" "${prod[@]}")

        if [[ -n "${VERCEL_ENV_ARGS_BIN:-}" && -f "${VERCEL_ENV_ARGS_BIN}" ]]; then
          echo "Loading environment variables from 1Password export..."
          mapfile -d '' -t ENV_ARGS < "${VERCEL_ENV_ARGS_BIN}"
          deploy_args+=("${ENV_ARGS[@]}")
        fi

        # The URL is the last line on stdout; progress goes to stderr.
        url=$(vercel deploy "${deploy_args[@]}" | tail -n1)
        [[ "${url}" == https://* ]] || { echo "::error::vercel deploy printed no deployment URL (got '${url}')"; exit 1; }
        echo "url=${url}" >> "$GITHUB_OUTPUT"
        echo "Deployed: ${url}"

    - name: Deploy with Vercel Build
      id: deploy-vercel
      if: inputs.build-mode == 'vercel'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        echo "Deploying to Vercel with Vercel build (${ENVIRONMENT})..."

        deploy_args=("--archive=tgz" "--token=${VERCEL_TOKEN}")
        # production is --prod; staging is a preview deploy (no flag).
        if [[ "${ENVIRONMENT}" == "production" ]]; then
          deploy_args+=("--prod")
        fi

        # Add environment variables from 1Password if available
        if [[ -n "${VERCEL_ENV_ARGS_BIN:-}" && -f "${VERCEL_ENV_ARGS_BIN}" ]]; then
          echo "Loading environment variables from 1Password export..."
          mapfile -d '' -t ENV_ARGS < "${VERCEL_ENV_ARGS_BIN}"
          deploy_args+=("${ENV_ARGS[@]}")
        fi

        # Add version variable from setup-version action if available
        if [[ -n "${VERSION_VAR_NAME:-}" && -n "${VERSION_VALUE:-}" ]]; then
          echo "Adding version variable ${VERSION_VAR_NAME}=${VERSION_VALUE}"
          deploy_args+=("--env" "${VERSION_VAR_NAME}=${VERSION_VALUE}")
        fi

        # Deploy (Vercel will build automatically). The URL is the last line on
        # stdout; progress goes to stderr.
        url=$(vercel deploy "${deploy_args[@]}" | tail -n1)
        [[ "${url}" == https://* ]] || { echo "::error::vercel deploy printed no deployment URL (got '${url}')"; exit 1; }
        echo "url=${url}" >> "$GITHUB_OUTPUT"
        echo "Deployed: ${url}"
