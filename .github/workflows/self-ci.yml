name: Continuous Integration

# CI of this repo itself: the same `pnpm lint` and `pnpm test` a developer
# runs locally (see package.json). actionlint covers every workflow and
# action, shellcheck the scripts, check-pr-cases the merge rules.

on:
  pull_request:
  push:
    branches: [v2]

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # The official download script, pinned to the commit of the release it
      # installs. shellcheck is part of the runner image.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_COMMIT: 914e7df21a07ef503a81201c76d2b11c789d3fca
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_COMMIT}/scripts/download-actionlint.bash" \
            | bash -s -- "$ACTIONLINT_VERSION" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          command -v shellcheck >/dev/null || { echo "::error::shellcheck is not on this runner"; exit 1; }

      - name: Lint workflows, actions and scripts
        run: pnpm lint

      - name: Test the check-pr rules
        run: pnpm test
