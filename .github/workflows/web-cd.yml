name: "Web CD (generic)"

on:
  workflow_call:
    inputs:
      platform:
        description: "Target deployment platform (vercel, azure, aws, ...)."
        required: true
        type: string
        default: "vercel"
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "22.x"
      pnpm-version:
        description: "PNPM version"
        required: false
        type: string
        default: "latest"
      working-directory:
        description: "Working directory for the project"
        required: false
        type: string
        default: "."
      environment:
        description: "Deployment environment (production, preview, staging)"
        required: false
        type: string
        default: "preview"
      use-custom-token:
        description: "Use custom Node.js auth token for private npm packages during Docker build"
        required: false
        type: boolean
        default: false

      # Code generation options
      codegen:
        description: "Enable code generation"
        required: false
        type: boolean
        default: false
      codegen_command:
        description: "Custom codegen command to run"
        required: false
        type: string
        default: ""

      # Build and test options
      run-test:
        description: "Run tests before deployment"
        required: false
        type: boolean
        default: true
      run-lint:
        description: "Run linting before deployment"
        required: false
        type: boolean
        default: true
      run-typecheck:
        description: "Run type checking before deployment"
        required: false
        type: boolean
        default: true
      run-format:
        description: "Run format check before deployment"
        required: false
        type: boolean
        default: false
      test-command:
        description: "Custom test command"
        required: false
        type: string
        default: "test --passWithNoTests"
      lint-command:
        description: "Custom lint command"
        required: false
        type: string
        default: "lint"
      typecheck-command:
        description: "Custom typecheck command"
        required: false
        type: string
        default: "typecheck"
      format-command:
        description: "Custom format check command"
        required: false
        type: string
        default: "format:check"
      build-mode:
        description: 'Build mode: "github" (build in GitHub Actions) or "vercel" (build on Vercel)'
        required: false
        type: string
        default: "github"
      prepare-package:
        description: "Prepare package.json for Vercel runtime"
        required: false
        type: boolean
        default: false

      # Vercel-specific options
      vercel-build-command:
        description: 'Custom build command for Vercel (when build-mode is "vercel")'
        required: false
        type: string
        default: ""
      vercel-output-directory:
        description: "Output directory for Vercel builds"
        required: false
        type: string
        default: ""

      # 1Password secrets
      # Translations CMS (@pursuit-amsterdam/translations-management)
      tms_enabled:
        description: "Pull published translations before building, and report the deploy back to the translations CMS"
        required: false
        type: boolean
        default: false
      release_id:
        description: "Release the translations CMS asked to deploy. Empty on push- and release-triggered runs; the CLI then falls back to the newest pending release."
        required: false
        type: string
        default: ""

      onepassword_enabled:
        description: "Enable 1Password secrets loading"
        required: false
        type: boolean
        default: false
      onepassword_vault:
        description: "1Password vault name"
        required: false
        type: string
        default: ""
      onepassword_item:
        description: "1Password item name"
        required: false
        type: string
        default: ""

    secrets:
      CUSTOM_GITHUB_TOKEN:
        required: false
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false

      # Only needed when TMS_URL / TMS_API_KEY are not already in the
      # 1Password item this deploy loads.
      TMS_URL:
        required: false
      TMS_API_KEY:
        required: false

      # Vercel secrets (only required when platform == 'vercel')
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
        
permissions:
  contents: read

jobs:
  vercel-deploy:
    if: ${{ inputs.platform == 'vercel' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js and PNPM (with custom token)
        if: inputs.use-custom-token
        uses: Pursuit-Amsterdam/workflows/.github/actions/setup-node-pnpm@main
        with:
          node-version: ${{ inputs.node-version }}
          node-auth-token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}

      - name: Setup Node.js and PNPM (with GitHub token)
        if: ${{ !inputs.use-custom-token }}
        uses: Pursuit-Amsterdam/workflows/.github/actions/setup-node-pnpm@main
        with:
          node-version: ${{ inputs.node-version }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load 1Password Secrets
        if: inputs.onepassword_enabled
        uses: Pursuit-Amsterdam/workflows/.github/actions/setup-onepassword@main
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault-name: ${{ inputs.onepassword_vault }}
          item-name: ${{ inputs.onepassword_item }}
          export-for-vercel: true

      # Credentials come from the 1Password item when this deploy loads one, which
      # is the normal case. Only fill the gaps from repository secrets, so an
      # unset secret cannot blank out a value 1Password already exported.
      - name: Provide translations credentials
        if: inputs.tms_enabled
        env:
          SECRET_TMS_URL: ${{ secrets.TMS_URL }}
          SECRET_TMS_API_KEY: ${{ secrets.TMS_API_KEY }}
        run: |
          if [ -z "${TMS_URL:-}" ] && [ -n "${SECRET_TMS_URL}" ]; then
            echo "TMS_URL=${SECRET_TMS_URL}" >> "$GITHUB_ENV"
          fi
          if [ -z "${TMS_API_KEY:-}" ] && [ -n "${SECRET_TMS_API_KEY}" ]; then
            echo "TMS_API_KEY=${SECRET_TMS_API_KEY}" >> "$GITHUB_ENV"
          fi

      # A release the CMS is waiting on expires after 3 minutes unless a deploy
      # acknowledges it, which buys 30. Everything above this step counts against
      # that window, so it goes as early as the CLI is usable — right after the
      # install and the secrets it needs.
      #
      # `ack` exits 0 even when the CMS is unreachable: losing the long window is
      # a far better outcome than failing a deploy over bookkeeping.
      - name: Tell the translations CMS a deploy is running
        if: inputs.tms_enabled
        run: pnpm exec translations release ack --release-id "${{ inputs.release_id }}"

      # Before the quality checks on purpose: pull rewrites the dictionaries and
      # regenerates settings.ts/types.ts, so typecheck then validates the copy
      # this deploy actually ships rather than what happened to be committed.
      - name: Pull published translations
        if: inputs.tms_enabled
        run: pnpm exec translations pull

      - name: Set version variable
        uses: Pursuit-Amsterdam/workflows/.github/actions/setup-version@main
        id: set-version
        with:
          # Get latest tag
          version: $(git describe --tags --abbrev=0 --always)
          framework: "nextjs"
          environment: ${{ inputs.environment }}

      - name: Run Code Generation
        if: inputs.codegen
        run: ${{ inputs.codegen_command }}

      - name: Run Quality Checks
        if: inputs.build-mode == 'github' && (inputs.run-test || inputs.run-lint || inputs.run-typecheck || inputs.run-format)
        uses: Pursuit-Amsterdam/workflows/.github/actions/run-pnpm-build-test@main
        with:
          # Quality checks validate the source, not the artifact — the actual
          # build happens once, below, as part of the deploy step itself.
          run-build: false
          run-test: ${{ inputs.run-test }}
          run-lint: ${{ inputs.run-lint }}
          run-typecheck: ${{ inputs.run-typecheck }}
          run-format: ${{ inputs.run-format }}
          test-command: ${{ inputs.test-command }}
          lint-command: ${{ inputs.lint-command }}
          typecheck-command: ${{ inputs.typecheck-command }}
          format-command: ${{ inputs.format-command }}

      - name: Deploy to Vercel
        uses: Pursuit-Amsterdam/workflows/.github/actions/deploy-vercel@main
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          environment: ${{ inputs.environment }}
          build-mode: ${{ inputs.build-mode }}
          prepare-package: ${{ inputs.prepare-package }}
          build-command: ${{ inputs.vercel-build-command }}

      # The CMS cannot observe this deploy, so it has to be told. Without these
      # steps a release that went live is expired as failed.
      - name: Mark the release deployed
        if: inputs.tms_enabled && success()
        run: pnpm exec translations release mark-deployed --release-id "${{ inputs.release_id }}"

      - name: Mark the release failed
        if: inputs.tms_enabled && failure()
        run: pnpm exec translations release mark-failed --release-id "${{ inputs.release_id }}" --reason "${{ inputs.environment }} deploy failed"

  unsupported-platform:
    if: ${{ inputs.platform != 'vercel' && inputs.platform != 'azure-asp' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Fail for unsupported platform
        run: |
          echo "Platform '${{ inputs.platform }}' is not supported by this workflow yet."
          echo "Supported platforms: vercel, azure-asp"
          exit 1
