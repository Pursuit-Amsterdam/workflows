name: Check and Validate PR branch

# Head and base come from the pull_request event, so callers pass no inputs.
# head-ref and base-ref stay declared (optional, unused) until every caller
# has dropped them: an unknown input is a startup_failure for the caller.
# check-pr.sh in the repo root mirrors this script for local runs: edit both.

on:
  workflow_call:
    inputs:
      head-ref:
        description: "Deprecated, ignored: the head branch is read from the pull_request event"
        required: false
        type: string
        default: ""
      base-ref:
        description: "Deprecated, ignored: the base branch is read from the pull_request event"
        required: false
        type: string
        default: ""

jobs:
  pipeline:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Check if merge is allowed
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ -z "$HEAD" || -z "$BASE" ]]; then
            echo "❌ No pull_request in the event: call this workflow from a pull_request trigger."
            exit 1
          fi

          echo "HEAD: $HEAD"
          echo "BASE: $BASE"

          # 1. Validate branch naming
          if [[
            "$HEAD" != "main" &&
            "$HEAD" != "develop" &&
            "$HEAD" != "acceptance" &&
            "$HEAD" != hotfix/* &&
            "$HEAD" != feature/* &&
            "$HEAD" != release/* &&
            "$HEAD" != dependabot/* &&
            "$HEAD" != module-develop/* &&
            "$HEAD" != module-feature/* &&
            ! "$HEAD" =~ ^v[0-9]+$ &&
            ! "$HEAD" =~ ^revert-[0-9]+-(main|develop|acceptance)$ &&
            ! "$HEAD" =~ ^revert-[0-9]+-(hotfix|feature|release|dependabot|module-develop|module-feature)/
          ]]; then
              echo "❌ Branch name '$HEAD' is not allowed."
              exit 1
          fi

          # 2. Merge rules

          # feature/*, hotfix/* → v2, v3, ... (version branches of this repo; a
          # version branch itself never merges anywhere)
          if [[ "$BASE" =~ ^v[0-9]+$ ]]; then
            if [[
              "$HEAD" == feature/* ||
              "$HEAD" == hotfix/* ||
              "$HEAD" =~ ^revert-[0-9]+-(feature|hotfix)/
            ]]; then
              echo "✅ Merge allowed: $HEAD → $BASE"
              exit 0
            else
              echo "❌ Merge not allowed: $HEAD → $BASE"
              exit 1
            fi
          fi

          # hotfix/*, release/*, develop → main
          if [[ "$BASE" == "main" ]]; then
            if [[
              "$HEAD" == hotfix/* ||
              "$HEAD" == release/* ||
              "$HEAD" == "develop" ||
              "$HEAD" =~ ^revert-[0-9]+-(hotfix|release)/ ||
              "$HEAD" =~ ^revert-[0-9]+-develop$
            ]]; then
              echo "✅ Merge allowed: $HEAD → main"
              exit 0
            else
              echo "❌ Merge not allowed: $HEAD → main"
              exit 1
            fi
          fi

          # feature/*, dependabot/*, module-develop/*, main → develop
          if [[ "$BASE" == "develop" ]]; then
            if [[
              "$HEAD" == feature/* ||
              "$HEAD" == dependabot/* ||
              "$HEAD" == module-develop/* ||
              "$HEAD" == "main" ||
              "$HEAD" =~ ^revert-[0-9]+-(feature|dependabot|module-develop)/ ||
              "$HEAD" =~ ^revert-[0-9]+-main$
            ]]; then
              echo "✅ Merge allowed: $HEAD → develop"
              exit 0
            else
              echo "❌ Merge not allowed: $HEAD → develop"
              exit 1
            fi
          fi

          # module-feature/* → module-develop/*
          if [[ "$BASE" == module-develop/* ]]; then
            if [[ "$HEAD" == module-feature/* || "$HEAD" =~ ^revert-[0-9]+-module-feature/ ]]; then
              echo "✅ Merge allowed: $HEAD → $BASE"
              exit 0
            else
              echo "❌ Merge not allowed: $HEAD → $BASE"
              exit 1
            fi
          fi

          # develop → release/*
          if [[ "$BASE" == release/* ]]; then
            if [[ "$HEAD" == "develop" || "$HEAD" =~ ^revert-[0-9]+-develop$ ]]; then
              echo "✅ Merge allowed: $HEAD → $BASE"
              exit 0
            else
              echo "❌ Merge not allowed: $HEAD → $BASE"
              exit 1
            fi
          fi

          # develop → acceptance
          if [[ "$BASE" == "acceptance" ]]; then
            if [[ "$HEAD" == "develop" || "$HEAD" =~ ^revert-[0-9]+-develop$ ]]; then
              echo "✅ Merge allowed: $HEAD → acceptance"
              exit 0
            else
              echo "❌ Merge not allowed: $HEAD → acceptance"
              exit 1
            fi
          fi

          # Stacked PRs (GitHub stacks target the parent branch, not an
          # integration branch). The stack retargets the child to develop/main
          # once the parent merges, and the rules above apply then.

          # feature/* → feature/*
          if [[ "$BASE" == feature/* ]]; then
            if [[ "$HEAD" == feature/* || "$HEAD" =~ ^revert-[0-9]+-feature/ ]]; then
              echo "✅ Merge allowed (stacked PR): $HEAD → $BASE"
              exit 0
            else
              echo "❌ Merge not allowed: $HEAD → $BASE"
              exit 1
            fi
          fi

          # hotfix/* → hotfix/*
          if [[ "$BASE" == hotfix/* ]]; then
            if [[ "$HEAD" == hotfix/* || "$HEAD" =~ ^revert-[0-9]+-hotfix/ ]]; then
              echo "✅ Merge allowed (stacked PR): $HEAD → $BASE"
              exit 0
            else
              echo "❌ Merge not allowed: $HEAD → $BASE"
              exit 1
            fi
          fi

          # module-feature/* → module-feature/*
          if [[ "$BASE" == module-feature/* ]]; then
            if [[ "$HEAD" == module-feature/* || "$HEAD" =~ ^revert-[0-9]+-module-feature/ ]]; then
              echo "✅ Merge allowed (stacked PR): $HEAD → $BASE"
              exit 0
            else
              echo "❌ Merge not allowed: $HEAD → $BASE"
              exit 1
            fi
          fi

          echo "❌ Merge not allowed: $HEAD → $BASE"
          exit 1
